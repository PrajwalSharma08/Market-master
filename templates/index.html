<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Market Master — Live Multi-Chart Trading Dashboard</title>

  <!-- Web App & Mobile Meta Tags -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Market Master" />
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <div class="brand__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      </div>
      <div class="brand__title">
        <span class="brand__name">MARKET MASTER</span>
        <span class="brand__badge">PRO</span>
      </div>
    </div>

    <div class="toolbar__divider"></div>

    <div class="toolbar__group">
      <span class="toolbar__label">Layout</span>
      <div class="seg" id="pane-count" role="radiogroup" aria-label="Number of charts">
        <button type="button" class="seg__btn" data-count="1" role="radio" aria-checked="false">1</button>
        <button type="button" class="seg__btn" data-count="2" role="radio" aria-checked="false">2</button>
        <button type="button" class="seg__btn" data-count="4" role="radio" aria-checked="false">4</button>
        <button type="button" class="seg__btn" data-count="6" role="radio" aria-checked="false">6</button>
        <button type="button" class="seg__btn" data-count="8" role="radio" aria-checked="false">8</button>
      </div>
    </div>

    <div class="toolbar__spacer"></div>

    <div class="toolbar__group toolbar__group--status" aria-live="polite">
      <span class="conn-pill" id="hl-conn-status" data-status="idle">
        <span class="conn-pill__dot"></span>
        <span class="conn-pill__label">Hyperliquid: idle</span>
      </span>
      <span class="conn-pill conn-pill--live">
        <span class="conn-pill__dot conn-pill__dot--green"></span>
        <span class="conn-pill__label">System: Active</span>
      </span>
    </div>
  </header>

  <main class="grid" id="grid" data-count="4"></main>

  <!-- Pane template cloned per chart pane. -->
  <template id="pane-template">
    <section class="pane">
      <header class="pane__header">
        <div class="pane__controls">
          <div class="pane__select-wrapper">
            <select class="pane__source" aria-label="Data source">
              <option value="hyperliquid">Hyperliquid (Crypto)</option>
              <option value="yfinance">Stocks (NSE/BSE)</option>
              <option value="forex">Forex</option>
            </select>
          </div>
          <div class="pane__search-wrapper">
            <svg class="pane__search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              class="pane__symbol"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-label="Symbol"
              placeholder="Search symbol…"
            />
          </div>
          <div class="pane__select-wrapper pane__select-wrapper--tf">
            <select class="pane__interval" aria-label="Timeframe">
              {% for tf in intervals %}
              <option value="{{ tf }}">{{ tf }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="button" class="pane__btn pane__indicators" title="Indicators (fx)" aria-label="Indicators">
            <span class="pane__btn-icon">ƒx</span>
            <span class="pane__btn-text">Indicators</span>
          </button>
          <button type="button" class="pane__btn pane__backtest" title="Strategy Backtest" aria-label="Backtest">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span class="pane__btn-text">Backtest</span>
          </button>
          <button type="button" class="pane__btn pane__btn--icon-only pane__refresh" title="Reload History" aria-label="Reload history">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
          </button>
        </div>
        <div class="pane__ticker" data-direction="flat">
          <span class="pane__ticker-symbol"></span>
          <span class="pane__ticker-price">—</span>
          <span class="pane__ticker-change"></span>
          <span class="pane__status" data-state="idle"></span>
        </div>
      </header>
      <div class="pane__chart"></div>
    </section>
  </template>

  <!--
    Lightweight Charts v5: vendored copy first, CDN fallback if missing.
    Run ``python _fetch_vendor.py`` to vendor it for offline operation.
  -->
  <script
    src="{{ url_for('static', filename='vendor/lightweight-charts.standalone.production.js') }}"
    onerror="var n=document.createElement('script');n.src='https://unpkg.com/lightweight-charts@5.0.7/dist/lightweight-charts.standalone.production.js';document.head.appendChild(n);"></script>

  <!-- Data clients -->
  <script src="{{ url_for('static', filename='js/yfinance.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hyperliquid.js') }}"></script>

  <!-- Indicator framework + bundled indicators (overlays + oscillators) -->
  <script src="{{ url_for('static', filename='js/indicators/math.js') }}"></script>
  <script src="{{ url_for('static', filename='js/indicators/overlays.js') }}"></script>
  <script src="{{ url_for('static', filename='js/indicators/oscillators.js') }}"></script>
  <script src="{{ url_for('static', filename='js/indicators/index.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ind_manager.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ind_popover.js') }}"></script>

  <!-- Strategies + backtest engine -->
  <script src="{{ url_for('static', filename='js/strategies/all.js') }}"></script>
  <script src="{{ url_for('static', filename='js/backtest.js') }}"></script>
  <script src="{{ url_for('static', filename='js/backtest_panel.js') }}"></script>

  <!-- UI components -->
  <script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pane.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  <!-- Service Worker Registration for Mobile App Support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}").catch(err => console.log('SW reg error:', err));
      });
    }
  </script>
</body>
</html>
